services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql, ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    environment:
      DATABASE_URL: mysql+pymysql://lab:lab@mysql:3306/lab
      JWT_SECRET_KEY: change-me-in-production
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      mysql: { condition: service_healthy }
      ollama-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args: { VITE_API_URL: http://localhost:8000 }
    ports: ["3000:80"]
    depends_on: { backend: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
  ollama-init:
    image: ollama/ollama:latest
    environment: { OLLAMA_HOST: http://ollama:11434 }
    depends_on: { ollama: { condition: service_healthy } }
    entrypoint: [sh, -c]
    command: ["ollama pull qwen2.5:3b"]
volumes:
  mysql_data:
  ollama_data: