<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Control Center - Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #2563eb;
            --brand-hover: #1d4ed8;
            --ink: #1e293b;
            --slate-500: #64748b;
            --slate-200: #e2e8f0;
            --slate-50: #f8fafc;
            --amber-50: #fffbeb;
            --amber-200: #fde68a;
            --amber-800: #92400e;
            --red-50: #fef2f2;
            --white: #ffffff;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--ink);
        }
        
        .login-container {
            width: 100%;
            max-width: 480px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--brand) 0%, #3b82f6 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
            position: relative;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            backdrop-filter: blur(10px);
        }
        
        .logo svg {
            width: 40px;
            height: 40px;
            fill: white;
        }
        
        .login-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        
        .login-subtitle {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 400;
            line-height: 1.5;
        }
        
        .login-body {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--ink);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--slate-500);
        }
        
        .form-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid var(--slate-200);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--white);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--slate-500);
            cursor: pointer;
            padding: 4px;
        }
        
        .password-toggle:hover {
            color: var(--ink);
        }
        
        .select-wrapper {
            position: relative;
        }
        
        .form-select {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid var(--slate-200);
            border-radius: 12px;
            font-size: 16px;
            background: var(--white);
            appearance: none;
            cursor: pointer;
        }
        
        .select-arrow {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--slate-500);
        }
        
        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--brand) 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }
        
        .login-button:active {
            transform: translateY(0);
        }
        
        .login-button.loading {
            pointer-events: none;
            opacity: 0.8;
        }
        
        .demo-accounts {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--slate-200);
        }
        
        .demo-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--slate-500);
            margin-bottom: 16px;
            text-align: center;
        }
        
        .demo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .demo-button {
            padding: 12px 8px;
            border: 1px solid var(--slate-200);
            border-radius: 8px;
            background: var(--slate-50);
            color: var(--slate-500);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .demo-button:hover {
            border-color: var(--brand);
            color: var(--brand);
            background: var(--red-50);
        }
        
        .demo-button.active {
            border-color: var(--brand);
            background: var(--red-50);
            color: var(--brand);
        }
        
        .notification {
            background: var(--amber-50);
            border: 1px solid var(--amber-200);
            color: var(--amber-800);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        
        .notification.show {
            display: block;
        }
        
        @media (max-width: 640px) {
            .login-container {
                margin: 10px;
            }
            
            .login-header {
                padding: 30px 20px;
            }
            
            .login-body {
                padding: 30px 20px;
            }
            
            .login-title {
                font-size: 24px;
            }
            
            .demo-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
                </svg>
            </div>
            <h1 class="login-title">Trung Tâm Kiểm Soát Phòng Lab</h1>
            <p class="login-subtitle">Hệ thống quản lý thiết bị, mượn trả, bảo trì và trợ lý AI thông minh</p>
        </div>
        
        <div class="login-body">
            <div class="notification" id="notification">
                Vui lòng điền đầy đủ thông tin đăng nhập
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Tên người dùng</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input 
                            type="text" 
                            id="username" 
                            class="form-input" 
                            placeholder="Nhập tên người dùng"
                            required
                        />
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                            <path d="M19 11a7 7 0 0 0-14 0v2a7 7 0 0 0 14 0v-2z"/>
                        </svg>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Nhập mật khẩu"
                            required
                        />
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="role">Vai trò</label>
                    <div class="select-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
                        </svg>
                        <select id="role" class="form-select" required>
                            <option value="">Chọn vai trò</option>
                            <option value="admin">Quản trị viên</option>
                            <option value="user">Người dùng</option>
                            <option value="technician">Kỹ thuật viên</option>
                        </select>
                        <svg class="select-arrow" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </div>
                </div>
                
                <button type="submit" class="login-button" id="loginButton">
                    <span id="buttonText">Đăng nhập</span>
                    <svg style="width: 20px; height: 20px; margin-left: 8px;" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                    </svg>
                </button>
            </form>
            
            <div class="demo-accounts">
                <div class="demo-title">Tài khoản thử nghiệm</div>
                <div class="demo-grid">
                    <button class="demo-button" data-role="admin" data-username="admin">
                        <div>Quản trị</div>
                        <div style="font-size: 10px; opacity: 0.7;">admin</div>
                    </button>
                    <button class="demo-button" data-role="user" data-username="user">
                        <div>Người dùng</div>
                        <div style="font-size: 10px; opacity: 0.7;">user</div>
                    </button>
                    <button class="demo-button" data-role="technician" data-username="technician">
                        <div>Kỹ thuật</div>
                        <div style="font-size: 10px; opacity: 0.7;">technician</div>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Password toggle functionality
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');
        
        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle icon
            passwordToggle.innerHTML = type === 'password' ? 
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' :
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
        });
        
        // Demo account functionality
        const demoButtons = document.querySelectorAll('.demo-button');
        const roleSelect = document.getElementById('role');
        const usernameInput = document.getElementById('username');
        
        demoButtons.forEach(button => {
            button.addEventListener('click', () => {
                const role = button.getAttribute('data-role');
                const username = button.getAttribute('data-username');
                
                // Update active state
                demoButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                // Set form values
                roleSelect.value = role;
                usernameInput.value = username;
            });
        });
        
        // Form submission
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const buttonText = document.getElementById('buttonText');
        const notification = document.getElementById('notification');
        
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            // Show loading state
            loginButton.classList.add('loading');
            buttonText.textContent = 'Đang xác thực...';
            
            // Simulate API call
            setTimeout(() => {
                // Hide notification
                notification.classList.remove('show');
                
                // Show loading state
                loginButton.classList.remove('loading');
                buttonText.textContent = 'Đăng nhập';
                
                // Simple validation (in real app, this would be handled by backend)
                if (!username || !password || !role) {
                    notification.textContent = 'Vui lòng điền đầy đủ thông tin đăng nhập';
                    notification.classList.add('show');
                    return;
                }
                
                // Success - in real app, this would redirect to dashboard
                alert(`Đăng nhập thành công!\nTên người dùng: ${username}\nVai trò: ${role}`);
                
                // Reset form
                loginForm.reset();
                demoButtons.forEach(btn => btn.classList.remove('active'));
            }, 2000);
        });
        
        // Auto-fill demo accounts when role is selected
        roleSelect.addEventListener('change', () => {
            const selectedRole = roleSelect.value;
            const demoButton = document.querySelector(`[data-role="${selectedRole}"]`);
            
            if (demoButton) {
                const username = demoButton.getAttribute('data-username');
                usernameInput.value = username;
                
                // Update active state
                demoButtons.forEach(btn => btn.classList.remove('active'));
                demoButton.classList.add('active');
            }
        });
    </script>
</body>
</html>
